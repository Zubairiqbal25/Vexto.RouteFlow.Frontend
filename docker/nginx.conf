# Serves one built Angular app (operator, driver or passenger) inside its own container.
#
# This is the *inner* nginx: it only ever answers to the reverse proxy in front of it
# (deploy/nginx), never to the internet, so there is no TLS and no hostname logic here. The proxy
# decides which container a request belongs to; this file decides how a request for that app is
# answered.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression for the text assets. Static gzip is not pre-generated by the Angular build, so
    # this is on-the-fly; the bundles are small enough that it costs nothing measurable.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               application/manifest+json font/woff2;
    gzip_min_length 1024;

    # Probed by the container HEALTHCHECK and by the reverse proxy. Not logged: a probe every
    # thirty seconds is noise in a log somebody may need to read.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime configuration. Written at container start from environment variables
    # (docker/40-vexto-config.sh), fetched by the app before it bootstraps. Never cached: a stale
    # config.json would point a fresh deployment's bundle at the previous API address.
    location = /config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # The service worker and its manifest (driver and passenger PWAs). The Angular service worker
    # checks ngsw.json for updates; if a browser cached it, it would never learn about a new build.
    location ~ ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Hashed bundles: the file name changes whenever the content does, so a year is safe.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is a route the Angular router owns: /dashboard, /routes, /trips/123. A deep
    # link or a refresh must load index.html and let the app resolve the path — never a 404.
    # index.html itself is not cached, so a new deployment is picked up on the next navigation.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
