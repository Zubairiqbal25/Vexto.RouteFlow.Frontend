<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vexto Driver</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1626" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- iOS ignores SVG manifest icons, so the home-screen icon has to be a PNG. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!--
      Resolves the theme before the first paint.

      Angular's ThemeService is the authority and does exactly this again once it boots, but it
      cannot run before the browser has painted, and a light dashboard flashing white in front of
      somebody who chose dark is the one theming bug users always notice. Deliberately tiny,
      dependency-free and wrapped in try/catch: storage can throw in a private window, and a theme
      is never worth failing a page load over.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vexto.theme');
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <vexto-root>
      <!-- vexto:boot-screen:start -->
      <!-- Generated by frontend/tools/brand/generate.mjs. Do not edit by hand. -->
      <style>
        .vexto-boot {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #f6f8fa;
          color: #0f8f85;
        }
        [data-theme='dark'] .vexto-boot {
          background: #0c1526;
          color: #2eb3a6;
        }
        .vexto-boot svg {
          animation: vexto-boot-in 320ms ease-out both;
        }
        .vexto-boot circle {
          animation: vexto-boot-pulse 1600ms ease-in-out 320ms infinite;
        }
        @keyframes vexto-boot-in {
          from {
            opacity: 0;
            transform: scale(0.96);
          }
          to {
            opacity: 1;
            transform: scale(1);
          }
        }
        @keyframes vexto-boot-pulse {
          0%,
          100% {
            opacity: 1;
          }
          50% {
            opacity: 0.35;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .vexto-boot svg,
          .vexto-boot circle {
            animation: none;
          }
        }
      </style>
      <div class="vexto-boot" role="status" aria-label="Loading Vexto">
        <svg
          width="39.916"
          height="44"
          viewBox="5.2 4.1 21.5 23.7"
          fill="none"
          aria-hidden="true"
          style="overflow: visible"
        >
          <path
            d="M7.8 6.8 L14.8 25.2 L19.8 12.2"
            stroke="currentColor"
            stroke-width="5.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle
            cx="24"
            cy="6.8"
            r="2.7"
            fill="currentColor"
          />
        </svg>
      </div>
      <!-- vexto:boot-screen:end -->
    </vexto-root>
  </body>
</html>
